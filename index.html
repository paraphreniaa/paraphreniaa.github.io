<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Marll</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            display: none;
        }

        .centered-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            border: 2px solid white;
            padding: 30px;
            color: #f2f2f2;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(0, 0, 0, 0.5));
            border-radius: 25px;
            box-shadow: 
                0 0 45px white, 
                0 0 20px rgba(0, 0, 0, 0.5);
        }

        .centered-box h1, .centered-box p {
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 1.8),  
                2px 2px 5px rgba(0, 0, 0, 1.7);
        }

        .top-bar {
            background-color: transparent;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            animation: fade-in 1s forwards;
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .logo img {
            width: 76px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(152, 230, 253, 0.5));
        }

        .centered-box h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .enter-text h1 {
            font-size: 70px;
            margin-bottom: 20px;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),  
                2px 2px 5px rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }

        .centered-box p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .centered-box .additional-section {
            font-size: 14px;
        }

        .button-link {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(152, 230, 253, 0.5);
        }
        
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid black;
            box-shadow: 0 0 50px 20px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
        }

        #overlay-text {
            font-size: 24px;
            color: #f2f2f2;
            text-align: center;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),  
                2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .image-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .image-buttons img {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .image-buttons img:hover {
            transform: scale(1.1);
        }

        .audio-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
        }

        .audio-controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .audio-controls button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startMedia()">
        <div id="overlay-text" class="enter-text">
            Click to Enter
        </div>
    </div>

    <video id="video" autoplay loop>
        <source src="video.mp4" type="video/mp4">
        Not supported Check your browser
    </video>

    <audio id="background-audio" loop>
        <source src="audio.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <div class="centered-box">
        <h1>Marll</h1>
        <p>Kill all the Gays</p> 
        <p class="additional-section">I hate all the mentally challenged and colored people</p> 

        <div class="image-buttons">
            <img src="icon1.png" alt="Copy Discord" onclick="copyText('govleaks')" title="Copy Discord">
        </div>
    </div>

    <div class="audio-controls">
        <button onclick="toggleAudio()">Play/Pause Audio</button>
    </div>

    <script>
        function startMedia() {
            var video = document.getElementById('video');
            var overlay = document.getElementById('overlay');
            var audio = document.getElementById('background-audio');

            overlay.style.display = 'none';
            video.style.display = 'block';
            video.currentTime = 0;
            video.play();

            // Play the audio when entering the site
            audio.play().catch(error => console.error("Audio playback failed:", error));
        }

        function toggleAudio() {
            var audio = document.getElementById('background-audio');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Copied: ' + text);
            }, function(err) {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body>
</html>
